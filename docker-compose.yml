services:
  laravel.test:
    image: sail-8.3/app
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        WWWGROUP: '1000'
    ports:
      - '8000:80'
    environment:
      WWWUSER: '1000'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
    volumes:
      - './backend:/var/www/html'
    networks:
      - petopia-net

networks:
  petopia-net:
    driver: bridge
